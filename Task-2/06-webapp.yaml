apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-api
  namespace: webapp-stack
  labels:
    app: webapp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-api
  template:
    metadata:
      labels:
        app: webapp-api
    spec:
      containers:
        - name: webapp-api
          image: webapp-api:task2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: webapp-config      # APP_TITLE, APP_ENV, MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-api
  namespace: webapp-stack
  labels:
    app: webapp-api
spec:
  type: ClusterIP
  selector:
    app: webapp-api
  ports:
    - port: 80
      targetPort: 8000
