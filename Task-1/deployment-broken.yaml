apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: webapp
  labels:
    app: web
spec:
  replicas: 3                  # 3 Pods, one per node
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1              # add at most 1 new Pod at a time during updates
      maxUnavailable: 0        # never remove an old Pod until a new one is Ready -> zero downtime
  template:
    metadata:
      labels:
        app: web
    spec:
      shareProcessNamespace: true   # containers in the Pod can see each other's processes
      # No volumes on purpose
      topologySpreadConstraints:    # spread the Pods across the 3 nodes
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web

      initContainers:
        - name: init-done
          image: busybox:1.36
          command: ["sh", "-c", "echo 'init failed'; exit 1"]

      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          readinessProbe:           # Pod only gets traffic once nginx answers
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: time-updater
          image: busybox:1.36
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]   # allows reaching nginx's files via /proc/<pid>/root
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                PID=$(pgrep -o nginx)
                if [ -n "$PID" ]; then
                  NOW=$(date '+%Y-%m-%d %H:%M:%S')
                  echo "<h1>hello in MLOPS MENA COMMUNITY : $NOW</h1>" \
                    > /proc/$PID/root/usr/share/nginx/html/index.html
                  echo "updated index.html (nginx pid $PID) at $NOW"
                else
                  echo "waiting for nginx..."
                fi
                sleep 5
              done